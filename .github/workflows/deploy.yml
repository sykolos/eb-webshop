name: Build & Deploy (Laravel)

on:
  push:
    branches: [develop, 'codex/**']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.31'
          extensions: mbstring, bcmath, fileinfo, pdo_sqlite, xml, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Verify shell scripts
        run: |
          bash -n scripts/deploy/package.sh
          bash -n scripts/deploy/remote.sh
          bash -n tests/Deployment/remote.sh
          shellcheck scripts/deploy/package.sh scripts/deploy/remote.sh tests/Deployment/remote.sh
      - name: Exercise deployment filesystem and failure paths
        run: sudo bash tests/Deployment/remote.sh
      - name: Run isolated tests
        run: vendor/bin/phpunit
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: public/build
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2.31'
          extensions: mbstring, bcmath, fileinfo, curl, pdo_mysql, xml, gd, zip
          coverage: none
      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: public/build
      - name: Prepare verified release
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }}
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > REVISION
          php scripts/deploy/configure-path.php
          bash scripts/deploy/package.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 14
      - name: Install SSH client helper
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Deploy via existing SSH connection
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSS_HOST: ${{ secrets.SSS_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }}
          ENV_DEVELOP: ${{ secrets.ENV_DEVELOP }}
          DEPLOY_PHP_BIN: ${{ vars.DEPLOY_PHP_BIN }}
        run: |
          set -euo pipefail
          umask 077
          for name in SSH_PASSWORD SSS_HOST SSH_USER SSH_PORT DEPLOY_PATH PUBLIC_PATH; do
            test -n "${!name}" || { echo "::error::Missing setting: $name"; exit 1; }
          done
          [[ $SSS_HOST =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ && $SSH_USER =~ ^[a-zA-Z0-9_-]+$ && $SSH_PORT =~ ^[0-9]+$ ]] || exit 1
          for path in "$DEPLOY_PATH" "$PUBLIC_PATH"; do
            [[ $path =~ ^/home/[a-zA-Z0-9_-]+/ebtest/[a-zA-Z0-9_-]+$ ]] || exit 1
          done
          [[ $(dirname "$DEPLOY_PATH") == "$(dirname "$PUBLIC_PATH")" && $DEPLOY_PATH != "$PUBLIC_PATH" ]] || exit 1
          PHP_BIN=${DEPLOY_PHP_BIN:-php}
          [[ $PHP_BIN =~ ^[a-zA-Z0-9_./-]+$ ]] || exit 1
          export SSHPASS="$SSH_PASSWORD"
          # Preserve the established connection settings; pinned host keys are deferred.
          ssh_args=(-p "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          scp_args=(-P "$SSH_PORT" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15)
          target="$SSH_USER@$SSS_HOST"
          incoming="$(dirname "$DEPLOY_PATH")/.deploy-incoming/$GITHUB_SHA"
          sshpass -e ssh "${ssh_args[@]}" "$target" "umask 077; mkdir -p '$incoming'"
          sshpass -e scp "${scp_args[@]}" "$RUNNER_TEMP/release/"* scripts/deploy/remote.sh "$target:$incoming/"
          if [[ -n $ENV_DEVELOP ]]; then
            printf '%s\n' "$ENV_DEVELOP" > "$RUNNER_TEMP/env.deploy"
            sshpass -e scp "${scp_args[@]}" "$RUNNER_TEMP/env.deploy" "$target:$incoming/env.deploy"
            rm -f "$RUNNER_TEMP/env.deploy"
          fi
          set +e
          remote_output=$(sshpass -e ssh "${ssh_args[@]}" "$target" "bash '$incoming/remote.sh' '$DEPLOY_PATH' '$PUBLIC_PATH' '$GITHUB_SHA' '$PHP_BIN'" 2>&1)
          remote_status=$?
          set -e
          printf '%s\n' "$remote_output"
          if [[ $remote_status -ne 0 ]]; then
            remote_summary=${remote_output//$'\n'/ }
            echo "::error title=Remote deploy failed::$remote_summary"
            set +e
            diagnostics=$(sshpass -e ssh "${ssh_args[@]}" "$target" "printf '%s\n' '--- deploy diagnostics ---'; if test -f '$incoming/preflight.log'; then cat '$incoming/preflight.log'; fi; printf '%s\n' '--- runtime markers ---'; ls -la '$incoming' '$DEPLOY_PATH/storage/framework' 2>&1" 2>&1)
            diagnostics_status=$?
            set -e
            printf '%s\n' "$diagnostics"
            diagnostics_summary=${diagnostics//$'\n'/ }
            echo "::error title=Remote deploy diagnostics::$diagnostics_summary"
          fi
          exit "$remote_status"
      - name: Check deployed website
        run: php scripts/deploy/smoke.php
