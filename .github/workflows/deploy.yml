name: Build & Deploy (Laravel)

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, tokenizer, xml, gd, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install PHP deps
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node deps
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Prepare deploy package
        run: |
          tar -czf /tmp/app.tgz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='public' \
            --exclude='storage/app/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/testing/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            .

          tar -C public -czf /tmp/public.tgz \
            --exclude='storage' \
            .

      - name: Prepare env file from secret
        env:
          ENV_DEVELOP: ${{ secrets.ENV_DEVELOP }}
        run: |
          if [ -n "$ENV_DEVELOP" ]; then
            printf '%s\n' "$ENV_DEVELOP" > .env.deploy
          fi

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Deploy via SSH
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSS_HOST: ${{ secrets.SSS_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PUBLIC_PATH: ${{ secrets.PUBLIC_PATH }}
        run: |
          set -euo pipefail

          missing=0
          for name in SSH_PASSWORD SSS_HOST SSH_USER SSH_PORT DEPLOY_PATH PUBLIC_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          PORT="$SSH_PORT"
          PHP_BIN="php"
          PUBLIC_DIR_NAME="$(basename "$PUBLIC_PATH")"
          export SSHPASS="$SSH_PASSWORD"
          SSH_OPTS="-p $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SCP_OPTS="-P $PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          echo "Testing SSH connection..."
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSS_HOST" "pwd >/dev/null"

          echo "Creating target directories..."
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSS_HOST" "mkdir -p '$DEPLOY_PATH' '$PUBLIC_PATH'"

          echo "Uploading application package..."
          sshpass -e scp $SCP_OPTS /tmp/app.tgz "$SSH_USER@$SSS_HOST:$DEPLOY_PATH/app.tgz"

          echo "Uploading public package..."
          sshpass -e scp $SCP_OPTS /tmp/public.tgz "$SSH_USER@$SSS_HOST:$PUBLIC_PATH/public.tgz"
          if [ -f .env.deploy ]; then
            echo "Uploading Laravel env file..."
            sshpass -e scp $SCP_OPTS .env.deploy "$SSH_USER@$SSS_HOST:$DEPLOY_PATH/.env.deploy"
          fi

          echo "Deploying on remote server..."
          sshpass -e ssh $SSH_OPTS "$SSH_USER@$SSS_HOST" "
            set -e
            cd '$DEPLOY_PATH'

            mkdir -p storage/app/public storage/framework/cache storage/framework/sessions storage/framework/testing storage/framework/views storage/logs bootstrap/cache

            find . -mindepth 1 -maxdepth 1 \
              ! -name '.env' \
              ! -name 'storage' \
              ! -name '$PUBLIC_DIR_NAME' \
              ! -name 'app.tgz' \
              -exec rm -rf {} +

            tar -xzf app.tgz
            rm app.tgz

            if [ -f .env.deploy ]; then
              mv .env.deploy .env
              chmod 600 .env
            fi

            cd '$PUBLIC_PATH'

            find . -mindepth 1 -maxdepth 1 \
              ! -name 'storage' \
              ! -name 'public.tgz' \
              -exec rm -rf {} +

            tar -xzf public.tgz
            rm public.tgz

            cd '$DEPLOY_PATH'
            if [ -f artisan ]; then
              $PHP_BIN artisan migrate --force
              $PHP_BIN artisan optimize:clear
              $PHP_BIN artisan config:cache
              $PHP_BIN artisan view:cache
            fi

            cd '$PUBLIC_PATH'
            rm -rf storage
            ln -s '$DEPLOY_PATH/storage/app/public' storage || true
          "
